<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Default SEO (overridden per page by react-helmet-async) -->
    <title>LuxuryHome – Premium Real Estate | Mansions, Villas & Luxury Properties</title>
    <meta name="description" content="Discover world-class luxury properties – mansions, villas, beachfront estates, hotels and investment land. Request a free quotation today." />
    <meta name="keywords" content="luxury real estate, mansions, villas, luxury apartments, beach properties, hotels, land for sale, Kenya luxury homes" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://luxuryhome.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LuxuryHome – Premium Real Estate" />
    <meta property="og:description" content="World-class luxury properties. Mansions, villas, beachfront estates and more." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://luxuryhome.com/" />
    <meta property="og:site_name" content="LuxuryHome" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LuxuryHome – Premium Real Estate" />
    <meta name="twitter:description" content="World-class luxury properties. Request a free quotation." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "LuxuryHome",
        "description": "Premium luxury real estate platform",
        "url": "https://luxuryhome.com",
        "logo": "https://luxuryhome.com/logo.png",
        "sameAs": [
          "https://twitter.com/luxuryhome",
          "https://instagram.com/luxuryhome"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
